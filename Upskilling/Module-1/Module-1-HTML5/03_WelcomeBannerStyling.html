<!--
3. Welcome Message with Styling and ID/Class

Scenario:
Display a welcome banner styled
uniquely for a logged-in user.

Objective:
Practice block/inline tags and
differentiate id and class.

Task:
• Use welcomeBanner ID

• Apply internal CSS

• Use inline styles for special offer

• Apply highlight class
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Welcome Banner</title>

    <style>
        #welcomeBanner {

            background-color: blue;
            color: white;
            padding: 20px;

        }

        .highlight {

            background-color: yellow;
            font-weight: bold;

        }
    </style>

</head>

<body>

    <div id="welcomeBanner">

        <h1>Welcome User</h1>

        <p class="highlight">

            Special Community Event Available

        </p>

        <p>

            Register today and get

            <span style="color:red;
                     font-weight:bold;">

                50% Offer

            </span>

        </p>

    </div>

</body>

</html>
