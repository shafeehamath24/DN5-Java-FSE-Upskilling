<!--
9. Geolocation for Event Mapping

Scenario:
Locate nearest event
to the user.

Objective:
Practice geolocation API,
error handling,
and options.

Task:
• Find nearby events

• Display coordinates

• Handle errors

• Use high accuracy
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Geolocation</title>

    <script>

        function findLocation() {

            navigator.geolocation.getCurrentPosition(

                success,

                error,

                {

                    enableHighAccuracy: true,
                    timeout: 5000

                }
            );
        }

        function success(position) {

            document.getElementById("location").innerHTML =

                "Latitude : " +

                position.coords.latitude +

                "<br>Longitude : " +

                position.coords.longitude;

        }

        function error() {

            alert("Unable to get location");

        }

    </script>

</head>

<body>

    <button onclick="findLocation()">

        Find Nearby Events

    </button>

    <p id="location"></p>

</body>

</html>
