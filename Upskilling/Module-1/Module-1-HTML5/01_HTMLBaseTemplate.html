<!--
1. Create the HTML5 Base Template

Scenario:
You’re setting up the base document
that every page on the portal will use.

Objective:
Ensure semantic structure and compatibility
across browsers.

Task:
• Use <!DOCTYPE html>, <html lang="en">,
  <meta charset="UTF-8">

• Add comments to label sections like
  Navigation, Main, Footer

• Save as index.html and open it in Chrome

• Inspect the document structure
  in Chrome Dev Tools
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,
                   initial-scale=1.0">

    <title>Community Event Portal</title>

</head>

<body>

    <!-- Navigation -->

    <nav>

        <h2>Community Portal</h2>

    </nav>

    <!-- Main -->

    <main>

        <h1>
            Welcome to Local Community Events
        </h1>

        <p>
            Find and register for events
            happening near you.
        </p>

    </main>

    <!-- Footer -->

    <footer>

        <p>
            © 2026 Community Council
        </p>

    </footer>

</body>

</html>
