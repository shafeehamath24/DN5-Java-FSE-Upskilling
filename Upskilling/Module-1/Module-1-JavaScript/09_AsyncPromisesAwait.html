<!--
9. Async JS, Promises, Async/Await 
Scenario: Fetch event data from a mock API. 
Objective: Use asynchronous logic for remote operations. 
Task: 
• Fetch events from a mock JSON endpoint 
• Use .then() and .catch() to handle results 
• Rewrite using async/await and show loading spinner
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Async Promises Await</title>

</head>

<body>

    <h1>Fetch Events</h1>

    <script>

        fetch(
            "https://jsonplaceholder.typicode.com/posts"
        )

            .then(response =>
                response.json()
            )

            .then(data =>
                console.log(data)
            )

            .catch(error =>
                console.log(error)
            );

        async function loadData() {

            try {

                let response =
                    await fetch(
                        "https://jsonplaceholder.typicode.com/posts"
                    );

                let data =
                    await response.json();

                console.log(data);

            }

            catch (error) {

                console.log(error);

            }
        }

        loadData();

    </script>

</body>

</html>
