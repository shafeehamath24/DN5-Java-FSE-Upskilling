<!--
6. Arrays and Methods 
Scenario: Manage an array of all community events. 
Objective: Use array methods for CRUD operations. 
Task: 
• Add new events using .push() 
• Use .filter() to show only music events 
• Use .map() to format display cards (e.g., "Workshop on Baking") 
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Arrays Methods</title>

</head>

<body>

    <h1>Array Methods</h1>

    <script>

        let events = [

            "Music Event",

            "Dance Event"

        ];

        events.push(
            "Workshop on Baking"
        );

        let musicEvents =
            events.filter(event =>
                event.includes("Music")
            );

        let formatted =
            events.map(event =>
                "Event : " + event
            );

        console.log(musicEvents);

        console.log(formatted);

    </script>

</body>

</html>
