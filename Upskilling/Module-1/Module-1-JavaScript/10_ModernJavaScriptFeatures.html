<!--
10. Modern JavaScript Features 
Scenario: Refactor code to be concise and maintainable. 
Objective: Use ES6+ features. 
Task: 
• Use let, const, default parameters in functions 
• Use destructuring to extract event details 
• Use spread operator to clone event list before filtering
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Modern JavaScript Features</title>

</head>

<body>

    <h1>ES6 Features</h1>

    <script>

        const events = [

            {
                name: "Music Fest",
                seats: 20
            }

        ];

        const clone =
            [...events];

        function showEvent(
            name = "Unknown Event"
        ) {

            console.log(name);

        }

        const {
            name,
            seats
        } = events[0];

        console.log(name);

        console.log(seats);

        console.log(clone);

    </script>

</body>

</html>
