<!--
13. Debugging and Testing 
Scenario: Registration is failing silently. You need to debug. 
Objective: Use browser tools to inspect and fix issues. 
Task: 
• Use Chrome Dev Tools Console and Network tab 
• Add breakpoints and inspect variables 
• Log form submission steps and check fetch request payload
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,
                   initial-scale=1.0">

    <title>Debugging and Testing</title>

    <style>
        body {

            font-family: Arial;
            padding: 20px;

        }

        button {

            background: red;
            color: white;
            padding: 10px 20px;
            border: none;

        }
    </style>

</head>

<body>

    <h1>

        Debugging Example

    </h1>

    <button onclick="submitForm()">

        Submit Form

    </button>

    <script>

        function submitForm() {

            console.log(

                "Form submission started"

            );

            debugger;

            let username =
                "Shafee";

            console.log(

                "Username :",
                username

            );

            fetch(

                "https://jsonplaceholder.typicode.com/posts",

                {

                    method: "POST",

                    body: JSON.stringify({

                        name: username

                    }),

                    headers: {

                        "Content-Type":
                            "application/json"

                    }

                }

            )

                .then(response =>

                    response.json()

                )

                .then(data => {

                    console.log(

                        "Response :",
                        data

                    );

                });

        }

    </script>

</body>

</html>
