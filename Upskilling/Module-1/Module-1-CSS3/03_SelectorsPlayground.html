<!--
3. Selectors Playground 
Scenario: You need to style various elements based on IDs, classes, and element types. 
Objective: Master different selector types. 
Task: 
• Use: 
o Universal selector * to reset margin/padding 
o Element selector to style all <h2> 
o ID selector #mainHeader for the banner 
o Class selector .eventCard for event containers 
o Grouping selector for h3, p to style together 
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Selectors Playground</title>

    <style>
        * {

            margin: 0;
            padding: 0;

        }

        h2 {

            color: green;

        }

        #mainHeader {

            background-color: navy;
            color: white;
            padding: 20px;

        }

        .eventCard {

            border: 1px solid gray;
            margin: 20px;
            padding: 15px;

        }

        h3,
        p {

            font-family: Arial;

        }
    </style>

</head>

<body>

    <div id="mainHeader">

        <h1>Community Event Portal</h1>

    </div>

    <div class="eventCard">

        <h3>Music Fest</h3>

        <p>Enjoy live music.</p>

    </div>

    <div class="eventCard">

        <h3>Food Fair</h3>

        <p>Taste delicious foods.</p>

    </div>

</body>

</html>
