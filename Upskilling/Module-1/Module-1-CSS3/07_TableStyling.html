<!--
7. Table Styling
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Table Styling</title>

    <style>
        table {

            border-collapse: collapse;
            width: 60%;

        }

        th,
        td {

            border: 1px solid black;
            padding: 10px;
            text-align: center;

        }

        th {

            background-color: lightblue;

        }

        tr:nth-child(even) {

            background-color: #eeeeee;

        }
    </style>

</head>

<body>

    <table>

        <tr>

            <th>ID</th>

            <th>Event</th>

        </tr>

        <tr>

            <td>1</td>

            <td>Music Fest</td>

        </tr>

        <tr>

            <td>2</td>

            <td>Food Fair</td>

        </tr>

    </table>

</body>

</html>
