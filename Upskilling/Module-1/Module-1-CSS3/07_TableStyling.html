<!--
7. Table Styling 
Scenario: The events admin table needs a cleaner look. 
Objective: Format tables using CSS. 
Task: 
• Style table, th, and td with borders, padding, and background color 
• Add zebra striping to rows using nth-child(even) 
• Use border-collapse: collapse and text-align: center
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Table Styling</title>

    <style>
        table {

            border-collapse: collapse;
            width: 60%;

        }

        th,
        td {

            border: 1px solid black;
            padding: 10px;
            text-align: center;

        }

        th {

            background-color: lightblue;

        }

        tr:nth-child(even) {

            background-color: #eeeeee;

        }
    </style>

</head>

<body>

    <table>

        <tr>

            <th>ID</th>

            <th>Event</th>

        </tr>

        <tr>

            <td>1</td>

            <td>Music Fest</td>

        </tr>

        <tr>

            <td>2</td>

            <td>Food Fair</td>

        </tr>

    </table>

</body>

</html>
