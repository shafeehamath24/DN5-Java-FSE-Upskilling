<!--
5. Typography: Fonts and Text
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Typography</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

    <style>
        body {

            font-family: 'Poppins',
                sans-serif;

        }

        h1 {

            font-size: 40px;
            font-weight: bold;

        }

        .description {

            text-align: justify;
            text-transform: capitalize;
            letter-spacing: 2px;
            line-height: 1.8;

        }
    </style>

</head>

<body>

    <h1>Community Event Portal</h1>

    <p class="description">

        welcome to the community event
        portal for local residents.

    </p>

</body>

</html>
