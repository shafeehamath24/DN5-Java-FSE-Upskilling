<!--
6. Link and List Styling
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Link and List Styling</title>

    <style>
        a:link {

            color: blue;

        }

        a:hover {

            color: red;

        }

        a:active {

            color: green;

        }

        a:visited {

            color: purple;

        }

        .nav {

            list-style: none;

        }

        .nav li {

            padding: 10px;
            margin: 5px;

        }
    </style>

</head>

<body>

    <ul class="nav">

        <li><a href="#">Home</a></li>

        <li><a href="#">Events</a></li>

        <li><a href="#">Contact</a></li>

    </ul>

</body>

</html>
