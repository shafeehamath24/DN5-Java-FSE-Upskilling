<!--
8. Box Model & Layout Control
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Box Model Layout</title>

    <style>
        .eventCard {

            border: 2px solid black;
            padding: 20px;
            margin: 20px;

        }

        .selectedField {

            outline: 3px solid red;

        }

        .hidden {

            visibility: hidden;

        }

        .none {

            display: none;

        }
    </style>

</head>

<body>

    <div class="eventCard">

        Community Meeting

    </div>

    <input type="text" class="selectedField">

    <p class="hidden">

        Hidden Text

    </p>

    <p class="none">

        Removed Text

    </p>

</body>

</html>
