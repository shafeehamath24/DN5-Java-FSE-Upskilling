<!--
1. Why CSS? Inline vs. Internal vs. External

Scenario:
The designer wants you to experiment
with different ways to apply styles.

Objective:
Understand various CSS inclusion methods
and their impact.

Task:
• Apply inline style
• Use internal CSS
• Link external stylesheet
• Add CSS comments
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,
                   initial-scale=1.0">

    <title>Why CSS</title>

    <!-- Internal CSS -->

    <style>
        /* Body styling */

        body {

            background-color: lightyellow;
            font-family: Arial;

        }

        /* Heading style */

        h2 {

            color: darkblue;

        }

        /* Paragraph styling */

        p {

            font-size: 18px;

        }
    </style>

</head>

<body>

    <!-- Inline CSS -->

    <h1 style="color:red;">

        Community Event Portal

    </h1>

    <h2>

        Upcoming Events

    </h2>

    <p>

        Explore local community activities
        and events happening around you.

    </p>

</body>

</html>
