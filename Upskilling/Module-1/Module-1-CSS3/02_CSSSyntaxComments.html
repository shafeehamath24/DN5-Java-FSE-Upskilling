<!--
2. CSS Syntax and Comments
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>CSS Syntax and Comments</title>

    <style>
        /* Header styles */

        h1 {

            color: #007BFF;

        }

        /* Button styles */

        .cta-button {

            background-color: #007BFF;
            color: white;
            padding: 10px 20px;
            border: none;

        }

        /* Event card styles */

        .event-card {

            border: 1px solid black;
            padding: 15px;
            margin-top: 20px;

        }
    </style>

</head>

<body>

    <h1>Community Event Portal</h1>

    <button class="cta-button">

        Register Now

    </button>

    <div class="event-card">

        Music Festival Event

    </div>

</body>

</html>
