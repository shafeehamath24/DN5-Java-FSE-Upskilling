<!--
4. Color & Background Styling
-->

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Color Background Styling</title>

    <style>
        body {

            background-image: url("bg.jpg");
            background-color: #f0f0f0;

        }

        h1 {

            color: #FF5733;

        }

        .eventCard {

            background-color:
                rgba(0, 150, 255, 0.3);

            padding: 20px;
            margin: 20px;

        }

        .section-header {

            background:
                linear-gradient(to right,
                    blue,
                    purple);

            color: white;
            padding: 10px;

        }
    </style>

</head>

<body>

    <h1 class="section-header">

        Community Events

    </h1>

    <div class="eventCard">

        Welcome to the event portal.

    </div>

</body>

</html>
